<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Expense Tracker</title>
  <meta name="description" content="Simple, private expense tracker. Data stays in your browser." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>💸 Expense Tracker</h1>
    <div class="actions">
      <input type="month" id="monthPicker" aria-label="Month" />
      <button id="exportBtn" class="btn ghost" title="Export CSV">Export CSV</button>
      <button id="themeBtn" class="btn ghost" title="Toggle theme">🌓</button>
    </div>
  </header>

  <main class="container">
    <section class="cards">
      <div class="card"><span class="label">Balance</span><strong id="balance">₹0</strong></div>
      <div class="card income"><span class="label">Income</span><strong id="income">₹0</strong></div>
      <div class="card expense"><span class="label">Expenses</span><strong id="expense">₹0</strong></div>
      <div class="card">
        <span class="label">Monthly budget
          <button id="budgetBtn" class="link">set</button></span>
        <strong id="budgetText">Not set</strong>
        <div class="bar"><div id="budgetFill" class="fill"></div></div>
      </div>
    </section>

    <div class="grid">
      <section class="panel">
        <h2 id="formTitle">Add transaction</h2>
        <form id="txForm" autocomplete="off">
          <div class="seg">
            <label><input type="radio" name="type" value="expense" checked /><span>Expense</span></label>
            <label><input type="radio" name="type" value="income" /><span>Income</span></label>
          </div>
          <label>Title
            <input type="text" id="title" required maxlength="60" placeholder="e.g. Lunch at canteen" />
          </label>
          <div class="row">
            <label>Amount (₹)
              <input type="number" id="amount" required min="0.01" step="0.01" placeholder="0.00" />
            </label>
            <label>Date
              <input type="date" id="date" required />
            </label>
          </div>
          <label>Category
            <select id="category"></select>
          </label>
          <label>Note (optional)
            <input type="text" id="note" maxlength="120" />
          </label>
          <div class="row">
            <button type="submit" class="btn primary" id="saveBtn">Add</button>
            <button type="button" class="btn ghost" id="cancelBtn" hidden>Cancel</button>
          </div>
        </form>
      </section>

      <section class="panel">
        <h2>Spending by category</h2>
        <div class="chart-wrap">
          <canvas id="chart" width="260" height="260" aria-label="Spending chart"></canvas>
          <ul id="legend" class="legend"></ul>
        </div>
      </section>
    </div>

    <section class="panel">
      <div class="list-head">
        <h2>Transactions</h2>
        <div class="filters">
          <input type="search" id="search" placeholder="Search…" />
          <select id="filterType">
            <option value="all">All</option>
            <option value="expense">Expenses</option>
            <option value="income">Income</option>
          </select>
          <select id="filterCat"><option value="all">All categories</option></select>
        </div>
      </div>
      <ul id="list" class="list"></ul>
      <p id="empty" class="empty" hidden>No transactions for this view.</p>
    </section>
  </main>

  <footer class="foot">Data is saved only in your browser (localStorage).
    <button id="clearBtn" class="link danger">Clear all data</button></footer>

  <script src="app.js"></script>
</body>
</html>
